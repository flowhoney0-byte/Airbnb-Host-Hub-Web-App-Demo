<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HostHub Demo – Airbnb Host Command Centre</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1c1c1e;--ink2:#46464b;--mut:#6b6b6b;--line:#e4e4e0;--ac:#d70f4e;--ac2:#b00c3f;--on:#fff;--warn:#8a5200;--bad:#a3200f;--ok:#0a6b2b;--okbg:#e7f6ec;--warnbg:#fff3dc;--badbg:#fde8e6;--tint:#fdecf1;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);--sh2:0 24px 48px -12px rgba(16,24,40,.3);--r:14px;--r2:10px;--t:.18s cubic-bezier(.2,.7,.2,1)}
[data-theme=rose]{--ac:#c8245f;--ac2:#a31a4b;--tint:#fbeaf1;--bg:#faf5f7}
[data-theme=ocean]{--ac:#2563eb;--ac2:#1d4fbd;--tint:#e8f0fe;--bg:#f3f6fb}
[data-theme=forest]{--ac:#2f7a3e;--ac2:#235f2f;--tint:#e6f3e9;--bg:#f3f7f3}
[data-theme=dark]{--bg:#0e0e10;--card:#18181b;--ink:#f4f4f5;--ink2:#d4d4d8;--mut:#a1a1aa;--line:#2c2c31;--ac:#ff5a7a;--ac2:#ff8aa0;--on:#1b0309;--warn:#f5c26b;--bad:#ff8a73;--ok:#6ddb8c;--okbg:#12301c;--warnbg:#33260c;--badbg:#3a1712;--tint:#2a1219;--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 24px 48px -12px rgba(0,0,0,.7)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"Helvetica Neue",Arial,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
.skip{position:absolute;left:-999px;top:8px;background:var(--ac);color:var(--on);padding:8px 14px;border-radius:var(--r2);z-index:99}.skip:focus{left:8px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font:800 21px/1 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.04em;margin:0 8px 22px;color:var(--ink)}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--ac);color:var(--on);display:grid;place-items:center}.logo small{display:block;font:500 12px/1.2 Inter,Arial,sans-serif;letter-spacing:0;color:var(--mut);margin-top:3px}
.np,.ns{display:flex;flex-direction:column;gap:2px}.ns{margin-top:2px}.more{display:none}
nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--ink2);padding:0 12px;min-height:42px;border-radius:var(--r2);font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background var(--t),color var(--t)}
nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--bg);color:var(--ink)}nav button.on{background:var(--tint);color:var(--ac);font-weight:650}
.col{display:flex;flex-direction:column;min-width:0}main{padding:32px clamp(16px,3vw,40px);flex:1;width:100%;max-width:1180px;margin:0 auto;outline:0}
footer{padding:20px;text-align:center;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
h2{font:700 28px/1.2 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.03em;margin:0 0 16px}h3{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0 0 12px}p{margin:0 0 12px}
.enter>*{animation:rise .24s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);transition:box-shadow var(--t),border-color var(--t)}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-size:30px;line-height:1.15;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.stat span{color:var(--mut);font-size:14px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;border-radius:var(--r2);font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--sh);transition:background var(--t),border-color var(--t),transform var(--t)}
.b:hover{background:var(--bg);border-color:#c9c9c4}.b:active{transform:scale(.98)}
.b.p{background:var(--ac);border-color:var(--ac);color:var(--on)}.b.p:hover{background:var(--ac2);border-color:var(--ac2)}.b.d{color:var(--bad)}.b.s{min-height:32px;padding:0 12px;font-size:14px}
.b:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}.bar h2,.bar h3{margin:0}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
tr:last-child td{border-bottom:0}tbody tr:hover td,table tr:hover td{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}.tag.warn{background:var(--warnbg);border-color:transparent;color:var(--warn)}.tag.bad{background:var(--badbg);border-color:transparent;color:var(--bad)}
.al{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;margin-bottom:10px;background:var(--warnbg);color:var(--warn);border-radius:var(--r2);font-size:15px}.al b{color:inherit}.al.bad{background:var(--badbg);color:var(--bad)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dh{font-size:12.5px;font-weight:600;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.dc{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:6px;overflow:hidden}.dc i{font-size:13px;color:var(--mut);font-style:normal;font-weight:600}
.dc.tdy{border:2px solid var(--ac)}.dc.tdy i{color:var(--ac)}.ch{display:block;color:#fff;font-size:12px;line-height:1.3;border-radius:6px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod{position:fixed;inset:0;background:rgba(10,10,14,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto;z-index:30;animation:fade .18s ease both}
.mod>div{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:580px;box-shadow:var(--sh2);animation:pop .22s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.fg label{font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:6px}.fg .w{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:15px;font-weight:400;min-height:44px;padding:9px 12px;border:1px solid #cfcfca;border-radius:var(--r2);background:var(--card);color:var(--ink);width:100%;transition:border-color var(--t),box-shadow var(--t)}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{border-color:#3d3d44}
input:hover,select:hover,textarea:hover{border-color:var(--mut)}input[type=checkbox]{min-height:0;accent-color:var(--ac)}textarea{min-height:130px;resize:vertical}
.pv{margin-top:14px;padding:12px 14px;border-radius:var(--r2);background:var(--tint);color:var(--ink);font-size:14.5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:40;font-weight:600;box-shadow:var(--sh2);animation:rise .24s ease both}
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}.empty::before{content:"";display:block;width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--tint);box-shadow:inset 0 0 0 10px var(--card),inset 0 0 0 28px var(--tint)}
.tour{position:fixed;right:20px;bottom:20px;max-width:340px;background:var(--ink);color:var(--bg);padding:18px;border-radius:var(--r);z-index:35;box-shadow:var(--sh2);animation:rise .24s ease both}.tour b{display:block;margin-bottom:4px}.tour .b{margin-top:10px}
@media(max-width:800px){.app{display:block}main{padding:20px 16px 24px}h2{font-size:24px}
 nav{position:fixed;inset:auto 0 0 0;height:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:20;overflow:visible}.logo{display:none}
 .np{flex-direction:row;gap:0}.np button,.more{flex:1;flex-direction:column;gap:2px;min-height:56px;padding:6px 2px;font-size:12px;justify-content:center;text-align:center}.more{display:flex}
 .ns{display:none;position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--sh2);display:none;flex-direction:row;flex-wrap:wrap;gap:4px}nav.open .ns{display:flex;animation:pop .2s ease both}
 .ns button{width:calc(50% - 2px);min-height:48px}.col{padding-bottom:84px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:16px}.stat b{font-size:24px}.fg{grid-template-columns:1fr}.cg{gap:3px}.dc{min-height:64px;padding:3px}.ch{font-size:11px;padding:1px 3px}
 th,td{padding:10px 12px}.mod{padding:0;align-items:flex-end}.mod>div{max-width:none;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
 .toast{bottom:90px}.tour{left:12px;right:12px;bottom:92px;max-width:none}}
@media(pointer:coarse){.b,.b.s{min-height:44px}input[type=checkbox]{width:22px;height:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{nav,.noprint,.toast,.tour,.skip{display:none!important}.app{display:block}main{padding:0;max-width:none}body{background:#fff}.card,.tw{box-shadow:none}.enter>*{animation:none}}
.demo{position:sticky;top:0;z-index:25;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:10px clamp(16px,3vw,40px);font-size:14px}.demo>span:first-child b{background:var(--ac);color:var(--on);padding:2px 8px;border-radius:99px;margin-right:10px;font-size:12px;letter-spacing:.06em}.demo .b{box-shadow:none;text-decoration:none}
@media print{.demo{display:none!important}}
</style></head><body>
<a class="skip" href="#main">Skip to content</a><div class="app"><nav id="nav" aria-label="Main"></nav><div class="col"><div class="demo" role="region" aria-label="Demo notice"><span><b>DEMO</b>Sample data. Some features are locked.</span><span><button class="b s" onclick="tour(0)">Take the tour</button> <a class="b s p" target="_blank" rel="noopener" href="#" id="buy">Get the full version</a></span></div><main id="main" tabindex="-1"></main><footer>All Rights Reserved BrandingStudioCo</footer></div></div>
<div id="mod"></div><div id="tour"></div>
<script>
const K='hosthub_demo_v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
let S,view='today',cal=new Date();cal.setDate(1);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const D=s=>new Date(s+'T00:00:00'),today=()=>iso(new Date());
const nights=b=>Math.max(0,Math.round((D(b.co)-D(b.ci))/864e5));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>S.set.cur+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=s=>D(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!S)S={props:[],book:[],exp:[],set:{theme:'',cur:'$',fee:3,name:''}};['sup','mnt','dmg'].forEach(k=>S[k]=S[k]||[])}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const prop=id=>S.props.find(p=>p.id==id)||{name:'(deleted property)',cost:0};
const col=id=>['#d70466','#00756f','#c2410c','#7b0051','#484848','#0a6e8a'][Math.max(0,S.props.findIndex(p=>p.id==id))%6];
function calc(b){if(b.src=='Blocked')return{n:nights(b),gross:0,fee:0,cost:0,net:0};const p=prop(b.pid),n=nights(b),gross=n*b.rate+ +b.clean,fee=gross*S.set.fee/100,cost=+p.cost||0;const f=+p.fx||1;return{n,gross:gross*f,fee:fee*f,cost:cost*f,net:(gross-fee-cost)*f}}
const active=b=>b.st!='Cancelled'&&b.src!='Blocked',holds=b=>b.st!='Cancelled';
const clash=b=>S.book.find(o=>o.id!=b.id&&o.pid==b.pid&&holds(o)&&b.ci<o.co&&b.co>o.ci);
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function M(h){$('#mod').innerHTML=`<div class=mod onclick="if(event.target==this)X()"><div role="dialog" aria-modal="true">${h}</div></div>`;const f=document.querySelector('#mod input,#mod select,#mod textarea');if(f&&!(window.matchMedia&&matchMedia('(pointer:coarse)').matches))f.focus()}
function X(){$('#mod').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key=='Escape')X()});
const NAV=[['today','Today'],['book','Bookings'],['cal','Calendar'],['clean','Cleanings'],['ops','Operations'],['guest','Guests'],['money','Money'],['price','Pricing'],['rep','Reports'],['msg','Messages'],['man','House manual'],['props','Properties'],['set','Settings']];
function go(v){view=v;render()}
function render(){document.documentElement.dataset.theme=S.set.theme||'';
 $('#nav').classList.remove('open');$('#nav').innerHTML=navHtml();
 $('#main').innerHTML=({today:vToday,book:vBook,cal:vCal,clean:vClean,ops:vOps,guest:vGuest,rep:vRep,money:vMoney,price:vPrice,msg:vMsg,man:vMan,props:vProps,set:vSet})[view]();if(view!==lastV){lastV=view;const m=$('#main');m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter')}}
function emptyP(){return `<div class="card empty"><h3>Start with your first property</h3><p>Add a listing, then log a booking. Today, Calendar and Money fill in on their own.</p><button class="b p" onclick="propForm()">Add property</button> <button class="b" onclick="sample()">Load sample data</button></div>`}
/* TODAY */
function vToday(){if(!S.props.length)return `<h2>Welcome${S.set.name?', '+esc(S.set.name):''}</h2>`+emptyP();
 const t=today(),ym=t.slice(0,7),A=S.book.filter(active),ins=A.filter(b=>b.ci==t),outs=A.filter(b=>b.co==t);
 const mb=A.filter(b=>b.co.slice(0,7)==ym),net=mb.reduce((s,b)=>s+calc(b).net,0),ex=S.exp.filter(e=>e.date.slice(0,7)==ym).reduce((s,e)=>s+ +e.amt,0);
 const dim=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();let nt=0;
 A.forEach(b=>{for(let d=1;d<=dim;d++){const ds=ym+'-'+String(d).padStart(2,'0');if(b.ci<=ds&&ds<b.co)nt++}});
 const occ=Math.round(nt/(dim*S.props.length)*100);
 const turn=A.filter(b=>b.co>=t&&A.some(o=>o.id!=b.id&&o.pid==b.pid&&o.ci==b.co));
 const unpaid=A.filter(b=>b.st=='Confirmed'&&b.ci<=t),dbl=A.filter(clash);
 let al='';const low=S.sup.filter(s=>+s.qty<=+s.min).length,urg=S.mnt.filter(m=>m.st!='Done'&&m.pri=='Urgent');
 if(low)al+=`<div class=al><b>${low} suppl${low>1?'ies are':'y is'} low.</b> <button class="b s" onclick="ops='sup';go('ops')">See shopping list</button></div>`;
 if(!S.set.bk||(Date.now()-D(S.set.bk))>30*864e5)al+=`<div class=al>${S.set.bk?'It has been over 30 days since your last backup.':'You have not saved a backup yet.'} Your data lives only in this browser. <button class="b s" onclick="backup()">Save backup</button></div>`;
 repIss().forEach(r=>al+=`<div class=al><b>Repeat issue:</b> ${esc(r.cat)} reported ${r.n} times at ${esc(prop(r.pid).name)} in 90 days. <button class="b s" onclick="ops='mnt';gt='i';go('guest')">Review</button></div>`);
 urg.forEach(m=>al+=`<div class="al bad"><b>Urgent job:</b> ${esc(m.title)} at ${esc(prop(m.pid).name)}. <button class="b s" onclick="ops='mnt';go('ops')">Open jobs</button></div>`);
 dbl.forEach(b=>al+=`<div class="al bad"><b>Double booking:</b> ${esc(b.guest)} at ${esc(prop(b.pid).name)} overlaps another stay (${fd(b.ci)}–${fd(b.co)}).</div>`);
 turn.forEach(b=>al+=`<div class=al><b>Same-day turnover</b> at ${esc(prop(b.pid).name)} on ${fd(b.co)}: ${esc(b.guest)} out, next guest in. Book the cleaner early.</div>`);
 unpaid.forEach(b=>al+=`<div class=al>Payout not marked paid: ${esc(b.guest)} (${money(calc(b).gross)}). <button class="b s" onclick="paid('${b.id}')">Mark paid</button></div>`);
 const soon=A.filter(b=>b.ci>t&&b.ci<=iso(new Date(Date.now()+7*864e5))).sort((a,b)=>a.ci<b.ci?-1:1);
 const li=(a,k)=>a.length?a.map(b=>`<div>${esc(b.guest)} · ${esc(prop(b.pid).name)}</div>`).join(''):`<span style="color:var(--mut)">None ${k}</span>`;
 return `<h2>Today${S.set.name?' · '+esc(S.set.name):''}</h2><div class=grid>
 <div class="card stat"><b>${ins.length}</b><span>check-ins today</span></div><div class="card stat"><b>${outs.length}</b><span>check-outs today</span></div>
 <div class="card stat"><b>${occ}%</b><span>occupancy this month</span></div><div class="card stat"><b>${money(net-ex)}</b><span>profit this month</span></div></div>
 <h3>Needs attention</h3>${al||'<div class=card>Nothing urgent. All clear.</div>'}
 <div class=grid style="margin-top:16px"><div class=card><h3>Arriving today</h3>${li(ins,'arriving')}</div><div class=card><h3>Leaving today</h3>${li(outs,'leaving')}</div>
 <div class=card><h3>Next 7 days</h3>${soon.length?soon.map(b=>`<div>${fd(b.ci)} · ${esc(b.guest)}</div>`).join(''):'<span style="color:var(--mut)">No arrivals</span>'}</div></div>
 <p style="color:var(--mut)">Profit = booking income minus platform fee, cleaning cost and logged expenses (checkouts this month).</p>`}
function paid(id){S.book.find(b=>b.id==id).st='Paid';save();render()}
/* BOOKINGS */
function vBook(){const L=[...S.book].sort((a,b)=>a.ci<b.ci?1:-1);
 return `<div class=bar><h2>Bookings</h2><span><button class=b onclick="icsForm()">Import calendar (.ics)</button> <button class="b p" onclick="bookForm()">New booking</button></span></div>`+(L.length?`<div class=tw><table><tr><th>Guest</th><th>Property</th><th>Stay</th><th>Nights</th><th>Income</th><th>You keep</th><th>Status</th><th></th></tr>`+L.map(b=>{const c=calc(b);return `<tr><td>${esc(b.guest)}<br><small>${esc(b.src)}</small></td><td>${esc(prop(b.pid).name)}</td><td>${fd(b.ci)} → ${fd(b.co)}</td><td>${c.n}</td><td>${money(c.gross)}</td><td><b>${money(c.net)}</b></td><td><span class="tag ${b.st=='Paid'?'ok':b.st=='Cancelled'?'bad':'warn'}">${b.st}</span></td><td><button class="b s" onclick="bookForm('${b.id}')">Edit</button></td></tr>`}).join('')+`</table></div>`:'<div class="card empty">No bookings yet.</div>')}
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
function bookForm(id){if(!S.props.length){toast('Add a property first');return go('props')}
 const b=S.book.find(x=>x.id==id)||{pid:S.props[0].id,src:'Airbnb',ci:today(),co:iso(new Date(Date.now()+2*864e5)),rate:S.props[0].rate,clean:S.props[0].clean,st:'Confirmed',guest:''};
 M(`<h3>${id?'Edit':'New'} booking</h3><div class=fg>
 <label class=w>Property<select id=f_pid onchange="pickP()">${S.props.map(p=>`<option value="${p.id}" ${b.pid==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
 <label>Guest name<input id=f_guest value="${esc(b.guest)}" oninput=pv()></label><label>Source<select id=f_src>${opt(['Airbnb','VRBO','Booking.com','Direct','Blocked'],b.src)}</select></label>
 <label>Check-in<input type=date id=f_ci value="${b.ci}" oninput=pv()></label><label>Check-out<input type=date id=f_co value="${b.co}" oninput=pv()></label>
